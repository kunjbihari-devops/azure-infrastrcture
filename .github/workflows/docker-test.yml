name: Docker Build Test

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Version
        run: docker --version

      - name: Build Docker Image
        run: docker build -t myapp:test .

      - name: List Docker Images
        run: docker images

      - name: Run Container
        run: docker run -d --name myapp-test myapp:test

      - name: Check Container
        run: docker ps
