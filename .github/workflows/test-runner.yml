name: Self Hosted Runner Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Runner
        run: |
          echo "Self Hosted Runner is working"
          hostname
          whoami
          git --version

      - name: Docker Version
        run: docker --version
